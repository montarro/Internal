<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Aymen's News</title>
  <meta name="description" content="A personal, filtered news feed — world & politics, soccer, Tunisia, the Middle East, North Africa and France, pulled from across the web." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">

    <!-- Mobile top bar -->
    <header class="mobilebar">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Aymen's&nbsp;News</span>
      </div>
      <button class="iconbtn" id="mobileSavedBtn" type="button" aria-pressed="false" aria-label="Saved articles">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 20.2s-7-4.4-9.4-8.9C1 8.2 2.4 4.9 5.6 4.2c1.9-.4 3.8.4 5 2 1.2-1.6 3.1-2.4 5-2 3.2.7 4.6 4 3 7.1C19 15.8 12 20.2 12 20.2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </header>

    <div class="scrim" id="scrim" hidden></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Aymen's&nbsp;News</span>
        <button class="iconbtn sidebar__close" id="closeMenuBtn" type="button" aria-label="Close menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <nav class="sidebar__nav" aria-label="Views">
        <button class="navitem" id="navLatest" type="button" aria-pressed="true">
          <svg class="navitem__icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 5h16M4 5v14a1 1 0 001 1h14a1 1 0 001-1V5M4 5L5 3h14l1 2M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="navLatestLabel">Latest News</span>
        </button>
        <button class="navitem" id="navSaved" type="button" aria-pressed="false">
          <svg class="navitem__icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 20.2s-7-4.4-9.4-8.9C1 8.2 2.4 4.9 5.6 4.2c1.9-.4 3.8.4 5 2 1.2-1.6 3.1-2.4 5-2 3.2.7 4.6 4 3 7.1C19 15.8 12 20.2 12 20.2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span id="navSavedLabel">Saved</span>
          <span class="navitem__count" id="savedCount"></span>
        </button>
      </nav>

      <div class="sidebar__section">
        <div class="sidebar__label" id="topicsLabel">Topics</div>
        <div class="sidebar__chips" id="chips" role="group" aria-label="Topics">
          <!-- category chips injected by script.js -->
        </div>
      </div>

      <div class="sidebar__section">
        <label class="sidebar__label" id="channelLabel" for="sourceSelect">Channel</label>
        <select class="sourceselect" id="sourceSelect" aria-label="Channel"></select>
      </div>

      <div class="sidebar__section">
        <div class="sidebar__label" id="languageLabel">Language</div>
        <!-- Language switch: labels stay in Latin so you can always get back -->
        <div class="langswitch" id="langSwitch" dir="ltr" role="group" aria-label="Language">
          <button class="lang" type="button" data-lang="en">EN</button>
          <button class="lang" type="button" data-lang="fr">FR</button>
          <button class="lang" type="button" data-lang="ar">AR</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" aria-label="News">
      <header class="topbar">
        <div class="topbar__titles">
          <h1 class="topbar__title" id="tagline">What's happening today</h1>
          <div class="topbar__date" id="dateLine"></div>
        </div>
        <div class="topbar__actions">
          <span class="updated" id="updatedLine" aria-live="polite"></span>
          <button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh">
            <svg class="refresh__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 0114.5-6M20.5 12a8.5 8.5 0 01-14.5 6M3.5 5v4h4M20.5 19v-4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <section class="searchbar" aria-label="Filters">
        <form class="search" id="searchForm" role="search">
          <svg class="search__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input
            class="search__input"
            id="searchInput"
            type="search"
            placeholder="Add a keyword (e.g. election, football, energy)…"
            autocomplete="off"
            aria-label="Keyword filter"
          />
          <button class="search__clear" id="clearBtn" type="button" aria-label="Clear keyword" hidden>&times;</button>
        </form>
        <div class="filterline">
          <span class="meta" id="metaLine" aria-live="polite">Loading…</span>
          <button class="clearfilters" id="clearFiltersBtn" type="button" hidden>Clear filters</button>
        </div>
      </section>

      <section class="featured" id="featuredWrap" hidden aria-label="Featured story">
        <!-- featured story injected by script.js -->
      </section>

      <section class="feed" id="feed" aria-live="polite" aria-busy="true">
        <!-- article rows injected by script.js -->
      </section>

      <!-- Empty / error states -->
      <div class="state" id="stateBox" hidden>
        <p class="state__title" id="stateTitle"></p>
        <p class="state__hint" id="stateHint"></p>
      </div>

      <footer class="legal" id="footer">
        Headlines link out to their original publishers, gathered from across the
        web via Google News.
      </footer>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
