<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Aymen's News</title>
  <meta name="description" content="A personal, filtered news feed — world & politics, soccer, Tunisia, the Middle East, North Africa and France, pulled from across the web." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-label="News">

    <header class="app__header">
      <div class="app__topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Aymen's&nbsp;News</span>
        </div>
        <!-- Language switch: labels stay in Latin so you can always get back -->
        <div class="langswitch" id="langSwitch" dir="ltr" role="group" aria-label="Language">
          <button class="lang" type="button" data-lang="en">EN</button>
          <button class="lang" type="button" data-lang="fr">FR</button>
          <button class="lang" type="button" data-lang="ar">AR</button>
        </div>
      </div>

      <div class="topbar">
        <div class="topbar__titles">
          <h1 class="topbar__title" id="tagline">What's happening today</h1>
          <div class="topbar__date" id="dateLine"></div>
        </div>
        <div class="topbar__actions">
          <span class="updated" id="updatedLine" aria-live="polite"></span>
          <button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh">
            <svg class="refresh__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 0114.5-6M20.5 12a8.5 8.5 0 01-14.5 6M3.5 5v4h4M20.5 19v-4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Controls: search, channel, topics — all on the front page -->
    <section class="controls" aria-label="Filters">
      <form class="search" id="searchForm" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input
          class="search__input"
          id="searchInput"
          type="search"
          placeholder="Add a keyword (e.g. election, football, energy)…"
          autocomplete="off"
          aria-label="Keyword filter"
        />
        <button class="search__clear" id="clearBtn" type="button" aria-label="Clear keyword" hidden>&times;</button>
      </form>

      <div class="sourcebar">
        <label class="sourcebar__label" id="channelLabel" for="sourceSelect">Channel</label>
        <select class="sourceselect" id="sourceSelect" aria-label="Channel"></select>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Topics">
        <!-- category chips injected by script.js -->
      </div>

      <div class="controls__foot">
        <span class="meta" id="metaLine" aria-live="polite">Loading…</span>
        <div class="foot__actions">
          <button class="clearfilters" id="clearFiltersBtn" type="button" hidden>Clear filters</button>
          <button class="savedbtn" id="savedBtn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 20.2s-7-4.4-9.4-8.9C1 8.2 2.4 4.9 5.6 4.2c1.9-.4 3.8.4 5 2 1.2-1.6 3.1-2.4 5-2 3.2.7 4.6 4 3 7.1C19 15.8 12 20.2 12 20.2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span id="savedLabel">Saved</span> <span id="savedCount"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- Feed -->
    <section class="feed" id="feed" aria-live="polite" aria-busy="true">
      <!-- article cards injected by script.js -->
    </section>

    <!-- Empty / error states -->
    <div class="state" id="stateBox" hidden>
      <p class="state__title" id="stateTitle"></p>
      <p class="state__hint" id="stateHint"></p>
    </div>

    <footer class="legal" id="footer">
      Headlines link out to their original publishers, gathered from across the
      web via Google News.
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
