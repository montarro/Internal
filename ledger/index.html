<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Weekly Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#14171C;
  --surface:#1D2129;
  --surface-2:#252A33;
  --line:#2A2F38;
  --text:#E9E7E2;
  --muted:#8B93A0;
  --teal:#4FB8AA;
  --coral:#E2624B;
  --gold:#D9A94E;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:28px 20px 60px;
}

/* header */
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:22px;
  gap:12px;
  flex-wrap:wrap;
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:26px;
  margin:0 0 2px;
  letter-spacing:-0.02em;
}
.week-range{
  font-family:'IBM Plex Mono',monospace;
  color:var(--muted);
  font-size:13px;
}
.nav{
  display:flex;
  align-items:center;
  gap:10px;
}
.nav button{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text);
  width:32px;height:32px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s, background .15s;
}
.nav button:hover{border-color:var(--gold);background:var(--surface-2);}
.nav .today{
  font-family:'Inter',sans-serif;
  font-size:12px;
  color:var(--muted);
  background:none;
  border:1px solid var(--line);
  border-radius:8px;
  padding:0 10px;
  height:32px;
  cursor:pointer;
  width:auto;
}
.nav .today:hover{color:var(--text);border-color:var(--gold);}

/* day strip */
.strip{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:20px;
}
.day{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 6px 8px;
  cursor:pointer;
  text-align:center;
  transition:border-color .15s, transform .1s;
  position:relative;
}
.day:hover{border-color:var(--gold);}
.day.active{border-color:var(--gold);background:var(--surface-2);}
.day .dname{
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}
.day.active .dname{color:var(--gold);}
.day .ddate{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--muted);
  margin-bottom:6px;
}
.barwrap{
  height:44px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  margin-bottom:4px;
}
.bar{
  width:14px;
  border-radius:3px 3px 0 0;
  background:var(--teal);
  min-height:2px;
  transition:height .25s ease;
}
.day .dsub{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text);
}

/* add form */
.addcard{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin-bottom:20px;
}
.addrow{
  display:grid;
  grid-template-columns:90px 1fr 100px 40px;
  gap:8px;
}
.addrow select, .addrow input[type=text], .addrow input[type=number]{
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:9px 10px;
  font-family:'Inter',sans-serif;
  font-size:13px;
  width:100%;
}
.addrow input[type=number]{font-family:'IBM Plex Mono',monospace;}
.addrow select:focus, .addrow input:focus{outline:none;border-color:var(--gold);}
.addrow button{
  background:var(--teal);
  color:#0E1216;
  border:none;
  border-radius:8px;
  font-weight:600;
  font-size:18px;
  cursor:pointer;
  transition:filter .15s;
}
.addrow button:hover{filter:brightness(1.1);}

/* entries */
.section-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em;
  margin:0 0 8px 2px;
}
.entries{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:22px;
}
.entry{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  gap:10px;
}
.entry:last-child{border-bottom:none;}
.entry .edesc{
  font-size:13px;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.entry .eday{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  color:var(--muted);
  background:var(--surface-2);
  border-radius:5px;
  padding:2px 6px;
  flex-shrink:0;
}
.entry .eamt{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  flex-shrink:0;
}
.entry .eflag{
  color:var(--gold);
  font-size:11px;
  font-style:italic;
}
.entry .edel{
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:14px;
  padding:2px 6px;
  flex-shrink:0;
}
.entry .edel:hover{color:var(--coral);}
.entry .ehouse{
  font-family:'Inter',sans-serif;
  font-size:10px;
  font-weight:600;
  background:var(--gold);
  color:#0E1216;
  border-radius:5px;
  padding:2px 7px;
  flex-shrink:0;
}
.empty{
  padding:20px 14px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
  background:var(--surface);
}

/* summary */
.summary{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 18px;
}
.srow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  padding:6px 0;
}
.srow .l{color:var(--muted);}
.srow .v{font-family:'IBM Plex Mono',monospace;font-size:14px;}
.srow.budget input{
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:7px;
  padding:5px 9px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  width:100px;
  text-align:right;
}
.srow.budget input:focus{outline:none;border-color:var(--gold);}
.divider{height:1px;background:var(--line);margin:6px 0;}
.remaining .v{font-size:19px;font-weight:600;}
.remaining .v.pos{color:var(--teal);}
.remaining .v.neg{color:var(--coral);}
.srow.house .v{color:var(--gold);}
.srow.house .l{font-style:italic;}

.stamp{
  position:absolute;
  top:-8px;right:-8px;
  width:0;height:0;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>Weekly Ledger</h1>
      <div class="week-range" id="weekRange">—</div>
    </div>
    <div class="nav">
      <button id="prevWeek">‹</button>
      <button class="today" id="todayBtn">This week</button>
      <button id="nextWeek">›</button>
    </div>
  </div>

  <div class="strip" id="strip"></div>

  <div class="addcard">
    <div class="addrow">
      <select id="inDay"></select>
      <input type="text" id="inDesc" placeholder="Description">
      <input type="number" id="inAmt" placeholder="0.00" step="0.01">
      <button id="inAdd">+</button>
    </div>
  </div>

  <div class="section-label" id="entriesLabel">All entries</div>
  <div class="entries" id="entries"></div>

  <div class="summary">
    <div class="srow">
      <div class="l">Total spent</div>
      <div class="v" id="sumSpent">$0.00</div>
    </div>
    <div class="srow house">
      <div class="l">House (separate)</div>
      <div class="v" id="sumHouse">$0.00</div>
    </div>
    <div class="srow budget">
      <div class="l">Weekly budget</div>
      <div><input type="number" id="sumBudget" step="0.01" placeholder="set budget"></div>
    </div>
    <div class="divider"></div>
    <div class="srow remaining">
      <div class="l">Remaining</div>
      <div class="v" id="sumRemaining">—</div>
    </div>
  </div>

</div>

<script>
/*
  Storage: each visitor keeps their OWN private copy in their browser
  (localStorage). The seeded weeks below show up for everyone on first
  visit, but any edits stay local to that person's device/session —
  nobody else sees them.
*/
const storage = {
  async get(key){
    try{
      const value = localStorage.getItem(key);
      return value === null ? null : { value };
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ localStorage.setItem(key, value); }
    catch(e){ console.error('storage save failed', e); }
  }
};

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function toISO(d){ return d.toISOString().slice(0,10); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmt(n){ return '$' + n.toFixed(2); }
function fmtDate(d){ return d.toLocaleDateString('en-AU',{month:'short',day:'numeric'}); }

function sundayOf(date){
  const d = new Date(date);
  const day = d.getUTCDay();
  d.setUTCDate(d.getUTCDate() - day);
  return d;
}

// figure out "this week" (Sun-Sat) relative to today
const TODAY = new Date();
const THIS_WEEK_START = toISO(sundayOf(TODAY));

let currentWeekStart = THIS_WEEK_START;
let selectedDay = null; // null = show all
let weekData = { budget: null, entries: [] };

const WEEK_SEEDS = {
  '2026-07-19': { entries: [
    {day:0, desc:'Apple iCloud', amount:14.99},
    {day:0, desc:'Coles', amount:16.30},
    {day:0, desc:'Just Ripe', amount:9.99},
    {day:1, desc:'House', amount:1300},
    {day:1, desc:'Aldi', amount:27.10},
    {day:1, desc:'Linkt', amount:20},
    {day:1, desc:'Bodero', amount:1, flag:'confirm amount'},
    {day:2, desc:'Kmart', amount:18},
    {day:2, desc:'Kmart', amount:17},
    {day:2, desc:'Coles', amount:30},
    {day:2, desc:'El Jannah', amount:37.90},
    {day:2, desc:'Lawyer consult', amount:318},
    {day:2, desc:'Barber', amount:70},
    {day:2, desc:'Sent', amount:20},
    {day:2, desc:'Petrol', amount:95},
  ]},
  '2026-07-12': { entries: [
    {day:0, desc:'EG Group', amount:8},
    {day:0, desc:'House', amount:2700},
    {day:0, desc:'Laundromat', amount:5},
    {day:0, desc:'Sent', amount:30},
    {day:1, desc:'Coffee for client', amount:13.20},
    {day:1, desc:'Coinspot deposit', amount:1500},
    {day:1, desc:'Petrol', amount:86},
    {day:1, desc:'Coles', amount:35},
    {day:1, desc:'Zambrero', amount:44},
    {day:1, desc:'Atomic', amount:15.95},
    {day:1, desc:"Grill'd", amount:11.90},
    {day:1, desc:'Skool', amount:12.99},
    {day:1, desc:"Wendy's", amount:15},
    {day:2, desc:'Business name', amount:47},
    {day:2, desc:'Woolworths', amount:18},
    {day:2, desc:'Subway', amount:9.70},
    {day:2, desc:'MRI', amount:300},
    {day:2, desc:'Equifax', amount:14.95},
    {day:3, desc:'Petrol', amount:60},
    {day:3, desc:'Withdraw', amount:100},
    {day:3, desc:'Apple', amount:20.49},
    {day:3, desc:'Claude', amount:170},
    {day:3, desc:'Gym', amount:25.90},
    {day:3, desc:'Amazon', amount:2.99},
    {day:5, desc:'Coffee for client', amount:13.20},
    {day:5, desc:'Bowling for client', amount:10},
    {day:5, desc:'Sent', amount:30},
    {day:5, desc:'Gym', amount:13.95},
    {day:5, desc:'Gym', amount:15.95, flag:'duplicate charge — check for refund'},
    {day:6, desc:"McDonald's", amount:5.30},
    {day:6, desc:'Spotify', amount:22.99},
    {day:6, desc:'Sent', amount:30},
  ]},
};

let idCounter = 1;
function nextId(){ return idCounter++; }
function isHouseEntry(e){ return e.desc.trim().toLowerCase().includes('house'); }

async function loadWeek(weekStart){
  currentWeekStart = weekStart;
  selectedDay = null;
  let stored = null;
  try{
    const res = await storage.get('ledger:' + weekStart, false);
    if(res) stored = JSON.parse(res.value);
  }catch(e){ stored = null; }

  if(stored){
    weekData = stored;
  } else if(WEEK_SEEDS[weekStart]){
    weekData = {
      budget: null,
      entries: WEEK_SEEDS[weekStart].entries.map(e => ({...e, id: nextId()}))
    };
    await saveWeek();
  } else {
    weekData = { budget: null, entries: [] };
  }
  render();
}

async function saveWeek(){
  await storage.set('ledger:' + currentWeekStart, JSON.stringify(weekData), false);
}

function render(){
  const start = fromISO(currentWeekStart);
  const end = new Date(start); end.setUTCDate(end.getUTCDate()+6);
  document.getElementById('weekRange').textContent =
    fmtDate(start) + ' – ' + fmtDate(end) + (currentWeekStart===THIS_WEEK_START ? '  ·  this week' : '');

  // day subtotals (anything named "house" is tracked separately, excluded here)
  const subtotals = [0,0,0,0,0,0,0];
  weekData.entries.forEach(e => { if(!isHouseEntry(e)) subtotals[e.day] += Number(e.amount||0); });
  const maxSub = Math.max(...subtotals, 1);

  // strip
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setUTCDate(d.getUTCDate()+i);
    const el = document.createElement('div');
    el.className = 'day' + (selectedDay===i ? ' active':'');
    const barH = Math.max(2, Math.round((subtotals[i]/maxSub)*40));
    el.innerHTML = `
      <div class="dname">${DAY_NAMES[i]}</div>
      <div class="ddate">${fmtDate(d)}</div>
      <div class="barwrap"><div class="bar" style="height:${barH}px"></div></div>
      <div class="dsub">${subtotals[i] ? fmt(subtotals[i]) : '—'}</div>
    `;
    el.onclick = () => { selectedDay = (selectedDay===i ? null : i); render(); };
    strip.appendChild(el);
  }

  // day select in add form
  const inDay = document.getElementById('inDay');
  const prevVal = inDay.value;
  inDay.innerHTML = DAY_NAMES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  inDay.value = selectedDay!==null ? selectedDay : (prevVal || new Date().getUTCDay());

  // entries list
  document.getElementById('entriesLabel').textContent =
    selectedDay!==null ? DAY_NAMES[selectedDay] + ' entries' : 'All entries';
  const list = document.getElementById('entries');
  list.innerHTML = '';
  const shown = weekData.entries
    .filter(e => selectedDay===null || e.day===selectedDay)
    .sort((a,b)=> a.day-b.day);

  if(shown.length===0){
    list.innerHTML = '<div class="empty">Nothing logged yet.</div>';
  } else {
    shown.forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="edesc">
          ${selectedDay===null ? `<span class="eday">${DAY_NAMES[e.day]}</span>` : ''}
          <span>${e.desc}</span>
          ${e.flag ? `<span class="eflag">${e.flag}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${isHouseEntry(e) ? '<span class="ehouse">House</span>' : ''}
          <span class="eamt">${fmt(Number(e.amount))}</span>
          <button class="edel" title="Remove">✕</button>
        </div>
      `;
      row.querySelector('.edel').onclick = () => {
        weekData.entries = weekData.entries.filter(x => x.id !== e.id);
        saveWeek(); render();
      };
      list.appendChild(row);
    });
  }

  // summary
  const total = weekData.entries.filter(e=>!isHouseEntry(e)).reduce((s,e)=>s+Number(e.amount||0),0);
  const houseTotal = weekData.entries.filter(e=>isHouseEntry(e)).reduce((s,e)=>s+Number(e.amount||0),0);
  document.getElementById('sumSpent').textContent = fmt(total);
  document.getElementById('sumHouse').textContent = fmt(houseTotal);
  document.getElementById('sumBudget').value = weekData.budget ?? '';
  const remEl = document.getElementById('sumRemaining');
  if(weekData.budget === null || weekData.budget === ''){
    remEl.textContent = 'set a budget';
    remEl.className = 'v';
  } else {
    const rem = Number(weekData.budget) - total;
    remEl.textContent = (rem<0?'-':'') + fmt(Math.abs(rem));
    remEl.className = 'v ' + (rem<0 ? 'neg' : 'pos');
  }
}

document.getElementById('inAdd').onclick = async () => {
  const day = Number(document.getElementById('inDay').value);
  const desc = document.getElementById('inDesc').value.trim();
  const amt = parseFloat(document.getElementById('inAmt').value);
  if(!desc || isNaN(amt)) return;
  weekData.entries.push({id: nextId(), day, desc, amount: amt});
  document.getElementById('inDesc').value='';
  document.getElementById('inAmt').value='';
  await saveWeek();
  render();
};

document.getElementById('inDesc').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('inAdd').click();
});
document.getElementById('inAmt').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('inAdd').click();
});

document.getElementById('sumBudget').addEventListener('change', async (e) => {
  const v = e.target.value;
  weekData.budget = v === '' ? null : parseFloat(v);
  await saveWeek();
  render();
});

document.getElementById('prevWeek').onclick = () => {
  const d = fromISO(currentWeekStart); d.setUTCDate(d.getUTCDate()-7);
  loadWeek(toISO(d));
};
document.getElementById('nextWeek').onclick = () => {
  const d = fromISO(currentWeekStart); d.setUTCDate(d.getUTCDate()+7);
  loadWeek(toISO(d));
};
document.getElementById('todayBtn').onclick = () => loadWeek(THIS_WEEK_START);

loadWeek(THIS_WEEK_START);
</script>
</body>
</html>
