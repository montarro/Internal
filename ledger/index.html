<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="dark"><title>Weekly Ledger</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>:root{--bg:#14171C;--surface:#1D2129;--surface-2:#252A33;--line:#2A2F38;--text:#E9E7E2;--muted:#8B93A0;--teal:#4FB8AA;--coral:#E2624B;--gold:#D9A94E}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}.acct{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace}.acct .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct button{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;transition:border-color .15s,color .15s;flex-shrink:0}.acct button:hover{border-color:var(--coral);color:var(--text)}.import{display:none;align-items:center;justify-content:space-between;gap:12px;background:rgba(217,169,78,.10);border:1px solid rgba(217,169,78,.35);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}.import.show{display:flex}.import .itxt{color:var(--text)}.import .iact{display:flex;gap:8px;flex-shrink:0}.import button{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}.import .igo{background:var(--gold);color:#0E1216}.import .idismiss{background:transparent;color:var(--muted);border:1px solid var(--line)}.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;margin:0 0 2px;letter-spacing:-0.02em}.week-range{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:13px}.nav{display:flex;align-items:center;gap:10px}.nav button{background:var(--surface);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}.nav button:hover{border-color:var(--gold);background:var(--surface-2)}.nav .today{font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:32px;cursor:pointer;width:auto}.nav .today:hover{color:var(--text);border-color:var(--gold)}.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;cursor:pointer;text-align:center;transition:border-color .15s,transform .1s;position:relative}.day:hover{border-color:var(--gold)}.day.active{border-color:var(--gold);background:var(--surface-2)}.day .dname{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--muted)}.day.active .dname{color:var(--gold)}.day .ddate{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:6px}.barwrap{height:44px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}.bar{width:14px;border-radius:3px 3px 0 0;background:var(--teal);min-height:2px;transition:height .25s ease}.day .dsub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text)}.addcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:20px}.addrow{display:grid;grid-template-columns:90px 1fr 100px 40px;gap:8px}.addrow select,.addrow input[type=text],.addrow input[type=number]{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;width:100%}.addrow input[type=number]{font-family:'IBM Plex Mono',monospace}.addrow select:focus,.addrow input:focus{outline:none;border-color:var(--gold)}.addrow button{background:var(--teal);color:#0E1216;border:none;border-radius:8px;font-weight:600;font-size:18px;cursor:pointer;transition:filter .15s}.addrow button:hover{filter:brightness(1.1)}.section-label{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px 2px}.entries{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}.entry{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);gap:10px}.entry:last-child{border-bottom:none}.entry .edesc{font-size:13px;display:flex;align-items:center;gap:8px;min-width:0}.entry .eday{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);background:var(--surface-2);border-radius:5px;padding:2px 6px;flex-shrink:0}.entry .eamt{font-family:'IBM Plex Mono',monospace;font-size:13px;flex-shrink:0}.entry .eflag{color:var(--gold);font-size:11px;font-style:italic}.entry .edel,.entry .eedit{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;flex-shrink:0}.entry .edel:hover{color:var(--coral)}.entry .eedit:hover{color:var(--gold)}.entry.editing{padding:8px 10px}.editform{display:grid;grid-template-columns:70px 1fr 90px auto auto;gap:6px;width:100%;align-items:center}.editform select,.editform input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 8px;font-family:'Inter',sans-serif;font-size:13px;width:100%}.editform input.einAmt{font-family:'IBM Plex Mono',monospace}.editform select:focus,.editform input:focus{outline:none;border-color:var(--gold)}.editform .esave,.editform .ecancel{border:none;border-radius:7px;cursor:pointer;font-size:14px;padding:7px 10px;font-weight:600}.editform .esave{background:var(--teal);color:#0E1216}.editform .esave:hover{filter:brightness(1.1)}.editform .ecancel{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}.editform .ecancel:hover{color:var(--text);border-color:var(--coral)}.entry .ehouse{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;background:var(--gold);color:#0E1216;border-radius:5px;padding:2px 7px;flex-shrink:0}.empty{padding:20px 14px;color:var(--muted);font-size:13px;text-align:center;background:var(--surface)}.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}.srow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0}.srow .l{color:var(--muted)}.srow .v{font-family:'IBM Plex Mono',monospace;font-size:14px}.srow.budget input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;font-family:'IBM Plex Mono',monospace;font-size:13px;width:100px;text-align:right}.srow.budget input:focus{outline:none;border-color:var(--gold)}.divider{height:1px;background:var(--line);margin:6px 0}.remaining .v{font-size:19px;font-weight:600}.remaining .v.pos{color:var(--teal)}.remaining .v.neg{color:var(--coral)}.srow.house .v{color:var(--gold)}.srow.house .l{font-style:italic}</style></head><body><div class="wrap"><div class="acct"><div class="who" id="acctWho">...</div><button id="signOut">Sign out</button></div><div class="import" id="importBanner"><div class="itxt" id="importText">Found expenses saved on this device. Import them into your account?</div><div class="iact"><button class="igo" id="importGo">Import</button><button class="idismiss" id="importDismiss">Dismiss</button></div></div><div class="top"><div><h1>Weekly Ledger</h1><div class="week-range" id="weekRange">-</div></div><div class="nav"><button id="prevWeek">&lsaquo;</button><button class="today" id="todayBtn">This week</button><button id="nextWeek">&rsaquo;</button></div></div><div class="strip" id="strip"></div><div class="addcard"><div class="addrow"><select id="inDay"></select><input type="text" id="inDesc" placeholder="Description"><input type="number" id="inAmt" placeholder="0.00" step="0.01"><button id="inAdd">+</button></div></div><div class="section-label" id="entriesLabel">All entries</div><div class="entries" id="entries"></div><div class="summary"><div class="srow"><div class="l">Total spent</div><div class="v" id="sumSpent">$0.00</div></div><div class="srow house"><div class="l">House (separate)</div><div class="v" id="sumHouse">$0.00</div></div><div class="srow budget"><div class="l">Weekly budget</div><div><input type="number" id="sumBudget" step="0.01" placeholder="set budget"></div></div><div class="divider"></div><div class="srow remaining"><div class="l">Remaining</div><div class="v" id="sumRemaining">-</div></div></div></div><script>
const storage = {
  async get(key){
    const week = key.split(':')[1];
    const r = await fetch('/api/ledger?week=' + encodeURIComponent(week));
    if(r.status === 401){ location.href = '/login.html'; return null; }
    if(!r.ok) return null;
    const data = await r.json();
    return { value: JSON.stringify(data) };
  },
  async set(key, value){
    const week = key.split(':')[1];
    const r = await fetch('/api/ledger', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ week, data: JSON.parse(value) })
    });
    if(r.status === 401){ location.href = '/login.html'; }
  }
};
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function toISO(d){ return d.toISOString().slice(0,10); }
function fromISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function fmt(n){ return '$' + n.toFixed(2); }
function fmtDate(d){ return d.toLocaleDateString('en-AU',{month:'short',day:'numeric'}); }
function sundayOf(date){
  const d = new Date(date);
  const day = d.getUTCDay();
  d.setUTCDate(d.getUTCDate() - day);
  return d;
}
const TODAY = new Date();
const THIS_WEEK_START = toISO(sundayOf(TODAY));
let currentWeekStart = THIS_WEEK_START;
let selectedDay = null;
let editingId = null;
let weekData = { budget: null, entries: [] };
let weekCache = {};
let idCounter = 1;
function nextId(){ return idCounter++; }
function isHouseEntry(e){ return e.desc.trim().toLowerCase().includes('house'); }
async function loadWeek(weekStart){
  currentWeekStart = weekStart;
  selectedDay = null;
  editingId = null;
  if(weekCache[weekStart]){
    weekData = weekCache[weekStart];
    render();
    return;
  }
  let stored = null;
  try{
    const res = await storage.get('ledger:' + weekStart);
    if(res) stored = JSON.parse(res.value);
  }catch(e){ stored = null; }
  weekData = (stored && Array.isArray(stored.entries))
    ? { budget: stored.budget != null ? stored.budget : null, entries: stored.entries }
    : { budget: null, entries: [] };
  weekData.entries = weekData.entries.map(e => (e && e.id != null) ? e : Object.assign({}, e, { id: nextId() }));
  weekCache[weekStart] = weekData;
  render();
}
// Saves in the background (fire-and-forget) so the UI stays instant.
function saveWeek(){
  weekCache[currentWeekStart] = weekData;
  storage.set('ledger:' + currentWeekStart, JSON.stringify(weekData));
}
function render(){
  const start = fromISO(currentWeekStart);
  const end = new Date(start); end.setUTCDate(end.getUTCDate()+6);
  document.getElementById('weekRange').textContent =
    fmtDate(start) + ' - ' + fmtDate(end) + (currentWeekStart===THIS_WEEK_START ? '  (this week)' : '');
  const subtotals = [0,0,0,0,0,0,0];
  weekData.entries.forEach(e => { if(!isHouseEntry(e)) subtotals[e.day] += Number(e.amount||0); });
  const maxSub = Math.max.apply(null, subtotals.concat([1]));
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setUTCDate(d.getUTCDate()+i);
    const el = document.createElement('div');
    el.className = 'day' + (selectedDay===i ? ' active':'');
    const barH = Math.max(2, Math.round((subtotals[i]/maxSub)*40));
    el.innerHTML =
      '<div class="dname">' + DAY_NAMES[i] + '</div>' +
      '<div class="ddate">' + fmtDate(d) + '</div>' +
      '<div class="barwrap"><div class="bar" style="height:' + barH + 'px"></div></div>' +
      '<div class="dsub">' + (subtotals[i] ? fmt(subtotals[i]) : '-') + '</div>';
    el.onclick = () => { selectedDay = (selectedDay===i ? null : i); render(); };
    strip.appendChild(el);
  }
  const inDay = document.getElementById('inDay');
  const prevVal = inDay.value;
  inDay.innerHTML = DAY_NAMES.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');
  inDay.value = selectedDay!==null ? selectedDay : (prevVal || new Date().getUTCDay());
  document.getElementById('entriesLabel').textContent =
    selectedDay!==null ? DAY_NAMES[selectedDay] + ' entries' : 'All entries';
  const list = document.getElementById('entries');
  list.innerHTML = '';
  const shown = weekData.entries
    .filter(e => selectedDay===null || e.day===selectedDay)
    .sort((a,b)=> a.day-b.day);
  if(shown.length===0){
    list.innerHTML = '<div class="empty">Nothing logged yet.</div>';
  } else {
    shown.forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry';
      if(editingId === e.id){
        row.classList.add('editing');
        const form = document.createElement('div');
        form.className = 'editform';
        const daySel = document.createElement('select');
        daySel.innerHTML = DAY_NAMES.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');
        daySel.value = e.day;
        const descIn = document.createElement('input');
        descIn.type = 'text';
        descIn.value = e.desc;
        const amtIn = document.createElement('input');
        amtIn.type = 'number';
        amtIn.step = '0.01';
        amtIn.className = 'einAmt';
        amtIn.value = e.amount;
        const saveBtn = document.createElement('button');
        saveBtn.className = 'esave';
        saveBtn.title = 'Save';
        saveBtn.innerHTML = '&#10003;';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'ecancel';
        cancelBtn.title = 'Cancel';
        cancelBtn.innerHTML = '&#10005;';
        const commit = () => {
          const nd = descIn.value.trim();
          const na = parseFloat(amtIn.value);
          if(!nd || isNaN(na)) return;
          e.desc = nd;
          e.amount = na;
          e.day = Number(daySel.value);
          editingId = null;
          saveWeek(); render();
        };
        const cancel = () => { editingId = null; render(); };
        saveBtn.onclick = commit;
        cancelBtn.onclick = cancel;
        [descIn, amtIn].forEach(inp => inp.addEventListener('keydown', ev => {
          if(ev.key === 'Enter') commit();
          if(ev.key === 'Escape') cancel();
        }));
        form.appendChild(daySel); form.appendChild(descIn); form.appendChild(amtIn); form.appendChild(saveBtn); form.appendChild(cancelBtn);
        row.appendChild(form);
        list.appendChild(row);
        setTimeout(() => descIn.focus(), 0);
        return;
      }
      const houseTag = isHouseEntry(e) ? '<span class="ehouse">House</span>' : '';
      const dayTag = selectedDay===null ? '<span class="eday">' + DAY_NAMES[e.day] + '</span>' : '';
      const flagTag = e.flag ? '<span class="eflag">' + e.flag + '</span>' : '';
      row.innerHTML =
        '<div class="edesc">' + dayTag + '<span>' + e.desc + '</span>' + flagTag + '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' + houseTag +
        '<span class="eamt">' + fmt(Number(e.amount)) + '</span>' +
        '<button class="eedit" title="Edit">&#9998;</button>' +
        '<button class="edel" title="Remove">&#10005;</button></div>';
      row.querySelector('.eedit').onclick = () => { editingId = e.id; render(); };
      row.querySelector('.edel').onclick = () => {
        weekData.entries = weekData.entries.filter(x => x.id !== e.id);
        if(editingId === e.id) editingId = null;
        saveWeek(); render();
      };
      list.appendChild(row);
    });
  }
  const total = weekData.entries.filter(e=>!isHouseEntry(e)).reduce((s,e)=>s+Number(e.amount||0),0);
  const houseTotal = weekData.entries.filter(e=>isHouseEntry(e)).reduce((s,e)=>s+Number(e.amount||0),0);
  document.getElementById('sumSpent').textContent = fmt(total);
  document.getElementById('sumHouse').textContent = fmt(houseTotal);
  document.getElementById('sumBudget').value = weekData.budget != null ? weekData.budget : '';
  const remEl = document.getElementById('sumRemaining');
  if(weekData.budget === null || weekData.budget === ''){
    remEl.textContent = 'set a budget';
    remEl.className = 'v';
  } else {
    const rem = Number(weekData.budget) - total;
    remEl.textContent = (rem<0?'-':'') + fmt(Math.abs(rem));
    remEl.className = 'v ' + (rem<0 ? 'neg' : 'pos');
  }
}
document.getElementById('inAdd').onclick = async () => {
  const day = Number(document.getElementById('inDay').value);
  const desc = document.getElementById('inDesc').value.trim();
  const amt = parseFloat(document.getElementById('inAmt').value);
  if(!desc || isNaN(amt)) return;
  weekData.entries.push({id: nextId(), day, desc, amount: amt});
  document.getElementById('inDesc').value='';
  document.getElementById('inAmt').value='';
  render();
  saveWeek();
};
document.getElementById('inDesc').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('inAdd').click();
});
document.getElementById('inAmt').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('inAdd').click();
});
document.getElementById('sumBudget').addEventListener('change', async (e) => {
  const v = e.target.value;
  weekData.budget = v === '' ? null : parseFloat(v);
  render();
  saveWeek();
});
document.getElementById('prevWeek').onclick = () => {
  const d = fromISO(currentWeekStart); d.setUTCDate(d.getUTCDate()-7);
  loadWeek(toISO(d));
};
document.getElementById('nextWeek').onclick = () => {
  const d = fromISO(currentWeekStart); d.setUTCDate(d.getUTCDate()+7);
  loadWeek(toISO(d));
};
document.getElementById('todayBtn').onclick = () => loadWeek(THIS_WEEK_START);
document.getElementById('signOut').onclick = async () => {
  try{ await fetch('/api/auth', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ action:'logout' }) }); }
  catch(e){}
  location.href = '/login.html';
};
function isWeekStr(w){
  if(typeof w !== 'string' || w.length !== 10) return false;
  if(w[4] !== '-' || w[7] !== '-') return false;
  for(let i=0;i<10;i++){ if(i===4||i===7) continue; if(w[i]<'0'||w[i]>'9') return false; }
  return true;
}
function localLedgerKeys(){
  const keys = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('ledger:') === 0) keys.push(k);
    }
  }catch(e){}
  return keys;
}
function maybeShowImport(){
  const keys = localLedgerKeys();
  if(keys.length){
    document.getElementById('importText').textContent =
      'Found ' + keys.length + ' week' + (keys.length>1?'s':'') + ' of expenses saved on this device. Import into your account?';
    document.getElementById('importBanner').classList.add('show');
  }
}
document.getElementById('importDismiss').onclick = () => {
  document.getElementById('importBanner').classList.remove('show');
};
document.getElementById('importGo').onclick = async () => {
  const btn = document.getElementById('importGo');
  btn.disabled = true; btn.textContent = 'Importing...';
  const keys = localLedgerKeys();
  for(const k of keys){
    const week = k.slice('ledger:'.length);
    if(!isWeekStr(week)) continue;
    try{
      const data = JSON.parse(localStorage.getItem(k));
      await fetch('/api/ledger', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ week, data })
      });
    }catch(e){}
  }
  keys.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  document.getElementById('importBanner').classList.remove('show');
  weekCache = {};
  loadWeek(currentWeekStart);
};
(async () => {
  try{
    const r = await fetch('/api/auth');
    if(!r.ok){ location.href = '/login.html'; return; }
    const me = await r.json();
    document.getElementById('acctWho').textContent = me.email || 'Signed in';
  }catch(e){
    location.href = '/login.html';
    return;
  }
  maybeShowImport();
  loadWeek(THIS_WEEK_START);
})();
</script></body></html>
